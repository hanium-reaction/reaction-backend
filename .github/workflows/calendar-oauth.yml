name: Google Calendar OAuth (EC2)

# GitHub Secrets 에 있는 캘린더 OAuth client secret 을 **값을 꺼내지 않고** 검증하고, 통과하면
# 라이브 EC2 `.env` 에 넣어 캘린더 연결을 켠다 (#478 후속).
#
# 왜 필요한가: `STAGING_GOOGLE_OAUTH_CLIENT_SECRET` 은 2026-05-23 에 등록됐지만 그걸 읽는
# 워크플로가 한 번도 없었다 — EC2 `.env` 는 UNSET 이라 `/calendar/connect` 가 항상 501 이다.
# GitHub Secrets 는 되읽을 수 없고, 콘솔도 최근 client 는 secret 을 생성 시점에만 보여 준다
# → 이 secret 이 유일본일 수 있다. 로그에 찍어 옮기는 대신 러너 위에서 곧장 `.env` 로 보낸다.
#
# mode
# - check  : 읽기 전용. EC2 `.env` 의 client_id + GitHub secret 으로 Google 토큰 엔드포인트에
#            **일부러 틀린 code** 를 보낸다. client 인증이 먼저 검사되므로
#            `invalid_grant` = 짝이 맞음 · `invalid_client` = 짝이 틀림(또는 client 삭제).
# - enable : check 통과 시에만 `GOOGLE_OAUTH_CLIENT_SECRET` + `GOOGLE_CALENDAR_ENABLED=true`
#            기록 → 재기동 → health.
# - disable: `GOOGLE_CALENDAR_ENABLED=false` 로 되돌린다(secret 은 남긴다) → 재기동 → health.
#            enable 의 롤백 경로.
#
# 안전:
# - workflow_dispatch 전용
# - secret 은 어떤 step 에서도 echo 하지 않는다. curl 인자(argv)로도 넘기지 않는다 — stdin 으로
#   넘겨 러너의 프로세스 목록에 남지 않게 한다. Google 응답은 `error` 필드만 출력한다.
# - `.env` 는 임시 파일 + os.replace 로 원자 교체 (provision-vapid.yml 과 같은 이유 — `.env` 는
#   DATABASE_URL·COLUMN_ENCRYPTION_KEY 의 유일본이다).
# - Cloud 콘솔 설정(Calendar API 사용 · freebusy 스코프 · 동의 화면 상태)은 이 워크플로가
#   확인할 수 없다 — 사용자 토큰이 있어야 드러난다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check(검증만) · enable(검증 통과 시 켜기) · disable(끄기)"
        type: choice
        options:
          - check
          - enable
          - disable
        default: check

concurrency:
  # deploy / toggle-* 와 같은 `.env`·서비스를 건드리므로 직렬화.
  group: deploy-ec2
  cancel-in-progress: false
  queue: max

jobs:
  calendar-oauth:
    name: "calendar oauth (${{ inputs.mode }})"
    runs-on: [self-hosted, ec2, reaction-backend]
    timeout-minutes: 10

    env:
      APP_DIR: /home/ubuntu/reaction-backend
      # 입력이 비면(수동 실행 외 경로) 쓰기 step 이 disable 로 오인되지 않게 check 로 떨어뜨린다.
      MODE: ${{ inputs.mode || 'check' }}

    steps:
      - name: Verify secret against the live client_id (read-only)
        if: env.MODE != 'disable'
        working-directory: ${{ env.APP_DIR }}
        env:
          CAL_SECRET: ${{ secrets.STAGING_GOOGLE_OAUTH_CLIENT_SECRET }}
          SECRET_CLIENT_ID: ${{ secrets.STAGING_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${CAL_SECRET}" ]; then
            echo "::error::STAGING_GOOGLE_OAUTH_CLIENT_SECRET 이 비어 있다."
            exit 1
          fi

          # 같은 키가 여러 줄이면 dotenv 관례상 마지막 줄. 따옴표·CR 제거.
          LIVE_CLIENT_ID=$({ grep -E '^GOOGLE_OAUTH_CLIENT_ID=' .env || true; } | tail -n1 | cut -d= -f2- | tr -d "\"'\r")
          if [ -z "${LIVE_CLIENT_ID}" ]; then
            echo "::error::EC2 .env 에 GOOGLE_OAUTH_CLIENT_ID 가 없다."
            exit 1
          fi

          # client_id 는 공개값이지만 secret 과 같은 날 등록된 짝인지만 본다.
          if [ "${LIVE_CLIENT_ID}" = "$(printf '%s' "${SECRET_CLIENT_ID}" | tr -d "\"'\r")" ]; then
            echo "client_id: EC2 .env 와 GitHub secret(STAGING_GOOGLE_OAUTH_CLIENT_ID) 일치"
          else
            echo "client_id: ⚠️ EC2 .env 와 GitHub secret(STAGING_GOOGLE_OAUTH_CLIENT_ID) 불일치 — client 가 바뀌었을 수 있다"
          fi

          # 일부러 틀린 code. Google 은 client 인증을 code 보다 먼저 검사한다.
          RESULT=$(printf '%s' "${CAL_SECRET}" | curl -s -m 20 -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_secret@-" \
            --data-urlencode "client_id=${LIVE_CLIENT_ID}" \
            --data-urlencode "code=reaction-calendar-oauth-probe" \
            --data-urlencode "redirect_uri=postmessage" \
            --data-urlencode "grant_type=authorization_code" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("error", "(error 없음)") + " | " + d.get("error_description", ""))')

          echo "token endpoint: ${RESULT}"
          case "${RESULT}" in
            invalid_grant*)
              VERDICT="valid"
              echo "✅ secret 이 EC2 의 client_id 와 짝이 맞다 (client 인증 통과, 틀린 code 만 거절됨)"
              ;;
            invalid_client*)
              VERDICT="invalid"
              echo "::error::❌ secret 이 EC2 의 client_id 와 맞지 않거나 client 가 없다 — 콘솔에서 새 secret 필요"
              ;;
            *)
              VERDICT="unknown"
              echo "::warning::예상 밖 응답 — 위 error 를 보고 판단"
              ;;
          esac

          {
            echo "### Calendar OAuth — ${MODE}"
            echo '```'
            echo "token endpoint: ${RESULT}"
            echo "verdict: ${VERDICT}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # invalid 는 어느 mode 든 job 을 실패로 표시한다. enable 은 valid 가 아니면 여기서 멈춘다.
          if [ "${VERDICT}" = "invalid" ]; then
            exit 1
          fi
          if [ "${MODE}" = "enable" ] && [ "${VERDICT}" != "valid" ]; then
            echo "::error::검증을 통과하지 못해 .env 를 건드리지 않는다."
            exit 1
          fi

      - name: Write calendar settings into .env (secret never printed)
        if: env.MODE != 'check'
        working-directory: ${{ env.APP_DIR }}
        env:
          CAL_SECRET: ${{ secrets.STAGING_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          ~/.local/bin/uv run --no-dev python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          mode = os.environ["MODE"]
          env_path = Path(".env")
          lines = env_path.read_text(encoding="utf-8").splitlines()

          drop = ("GOOGLE_CALENDAR_ENABLED=",)
          add = []
          if mode == "enable":
              drop += ("GOOGLE_OAUTH_CLIENT_SECRET=",)
              add += [
                  f"GOOGLE_OAUTH_CLIENT_SECRET={os.environ['CAL_SECRET']}",
                  "GOOGLE_CALENDAR_ENABLED=true",
              ]
          elif mode == "disable":  # secret 은 남긴다 (다시 켤 때 재검증만 하면 된다)
              add += ["GOOGLE_CALENDAR_ENABLED=false"]
          else:
              raise SystemExit(f"unknown mode: {mode!r}")

          kept = [line for line in lines if not line.startswith(drop)]
          redirect = [line for line in kept if line.startswith("GOOGLE_OAUTH_REDIRECT_URI=")]
          if redirect and redirect[-1].split("=", 1)[1].strip().strip("\"'"):
              print("⚠️ GOOGLE_OAUTH_REDIRECT_URI 가 설정돼 있다 — FE popup 흐름은 비어 있어야(postmessage) 한다")

          # 원자 교체 — truncate-then-write 는 도중 실패 시 유일본 .env 를 빈 파일로 남긴다.
          tmp = Path(".env.calendar-oauth-tmp")
          tmp.write_text("\n".join(kept + add) + "\n", encoding="utf-8")
          shutil.copymode(env_path, tmp)
          os.replace(tmp, env_path)
          PY

          echo "GOOGLE_CALENDAR_ENABLED: $(grep '^GOOGLE_CALENDAR_ENABLED=' .env | tail -n1 | cut -d= -f2-)"
          SECRET_LEN=$({ grep '^GOOGLE_OAUTH_CLIENT_SECRET=' .env || true; } | tail -n1 | cut -d= -f2- | tr -d '\n' | wc -c)
          echo "GOOGLE_OAUTH_CLIENT_SECRET: $([ "${SECRET_LEN}" -gt 0 ] && echo "SET (${SECRET_LEN} chars)" || echo UNSET)"

          # 앱과 같은 경로(get_settings)로 읽어 501 스위치가 풀리는지 확인 — 값은 출력 안 함.
          ~/.local/bin/uv run --no-dev python -c "
          from reaction_backend.config import get_settings
          c = get_settings()
          on = bool(c.google_calendar_enabled and c.google_oauth_client_id and c.google_oauth_client_secret)
          print('calendar connect switch:', 'ON (501 해제)' if on else 'OFF (501)')
          "

      - name: Restart app
        if: env.MODE != 'check'
        run: sudo systemctl restart reaction-backend

      - name: Health check
        if: env.MODE != 'check'
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health -o /tmp/health.json; then
              if grep -q '"status":"ok"' /tmp/health.json; then
                echo "healthy:"; cat /tmp/health.json; exit 0
              fi
            fi
            sleep 2
          done
          echo "::error::health check failed after restart"
          exit 1

      - name: Summary
        if: always() && env.MODE != 'check'
        run: |
          {
            echo ""
            echo "롤백: 같은 워크플로를 mode=disable 로 재실행 (GOOGLE_CALENDAR_ENABLED=false, secret 유지)."
            echo "확인: env-check.yml 의 'Google Calendar 연결' 섹션."
          } >> "$GITHUB_STEP_SUMMARY"
