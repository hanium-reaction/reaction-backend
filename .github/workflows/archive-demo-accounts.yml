name: Archive demo accounts (EC2)

# stub 로그인이 만든 데모 계정(`demo@reaction.local`, `demo+<id>@reaction.local`)을 보관한다.
# 라이브 가입자 76명 중 67명이 이 계정이었다(2026-09-17, toggle-signups.yml show).
# 무엇을·왜 — scripts/archive_demo_accounts.py docstring 참고. archived_at 만 채운다.
#
# 안전:
# - workflow_dispatch 전용 (push/PR 로는 절대 트리거되지 않음)
# - 기본 mode=dry-run (아무것도 쓰지 않고 개수만 보고) — apply 는 명시 선택 + expect 필수.
#   expect 가 실제 대상 수와 다르면 스크립트가 쓰기 전에 실패한다.
# - soft delete only (users.archived_at), hard delete·익명화 없음 — 되돌릴 수 있다
# - 레포가 PUBLIC 이라 로그도 공개 — 스크립트는 이메일·이름·id 를 출력하지 않는다
# - 입력은 환경변수로만 넘기고 expect 는 숫자인지 검사한 뒤에 쓴다(셸 주입 방지)
#
# ⚠️ 스크립트는 $APP_DIR(= deploy.yml 이 rsync 한 최신 main)에서 실행된다 — 머지·배포 전에
# dispatch 하면 Verify 스텝이 막는다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run(보고만) 또는 apply(실제 보관)"
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
      expect:
        description: "apply 시 필수 — dry-run 이 보고한 대상 수 (예: 67)"
        type: string
        default: ""

concurrency:
  # deploy 와 같은 앱 디렉터리를 쓰므로 배포와 겹치지 않게 직렬화.
  group: deploy-ec2
  cancel-in-progress: false
  queue: max

jobs:
  archive:
    name: "archive demo accounts (${{ inputs.mode }})"
    runs-on: [self-hosted, ec2, reaction-backend]
    timeout-minutes: 10

    env:
      APP_DIR: /home/ubuntu/reaction-backend
      MODE: ${{ inputs.mode || 'dry-run' }}
      EXPECT: ${{ inputs.expect }}

    steps:
      - name: Verify deployed script
        working-directory: ${{ env.APP_DIR }}
        run: |
          test -f scripts/archive_demo_accounts.py \
            || { echo "::error::스크립트가 배포되지 않았다 — 머지·배포 후 다시 실행할 것"; exit 1; }

      - name: Run
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${MODE}" = "apply" ]; then
            if ! [[ "${EXPECT}" =~ ^[0-9]+$ ]]; then
              echo "::error::apply 는 expect(숫자)가 필요하다 — 먼저 dry-run 으로 대상 수를 확인할 것"
              exit 1
            fi
            ARGS+=(--apply --expect "${EXPECT}")
          fi
          echo "mode=${MODE} args=${ARGS[*]:-}"
          # 빈 배열 + set -u 안전 전개 (dry-run 이면 인자 없음).
          ~/.local/bin/uv run --no-dev python -m scripts.archive_demo_accounts ${ARGS[@]+"${ARGS[@]}"} \
            | tee "${RUNNER_TEMP}/archive-demo.out"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Archive demo accounts — ${MODE}"
            echo '```'
            tail -n 40 "${RUNNER_TEMP}/archive-demo.out" 2>/dev/null || echo '(출력 없음 — 위 스텝 로그 확인)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
